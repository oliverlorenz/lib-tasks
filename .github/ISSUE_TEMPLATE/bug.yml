name: Bug Report
description: Something is not working as expected
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A code snippet or step-by-step instructions to reproduce the bug.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "e.g. 1.2.3"
    validations:
      required: true
